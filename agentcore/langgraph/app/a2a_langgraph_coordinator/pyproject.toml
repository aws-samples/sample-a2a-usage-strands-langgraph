[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "a2a-langgraph-coordinator"
version = "0.1.0"
description = "Account-free LangGraph A2A coordinator template for AgentCore Runtime."
requires-python = ">=3.10,<3.15"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "aws-opentelemetry-distro==0.22.0",
  "bedrock-agentcore[a2a-v1]==1.25.3",
  "boto3==1.43.124",
  "botocore[crt]==1.43.124",
  "langchain-aws==1.9.1",
  "langgraph==1.2.20",
  "opentelemetry-instrumentation-langchain==0.63.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
